# Opcional: MySQL 8.4 para desarrollo local.
# El diseño NO exige Docker; también sirve MySQL instalado o MAMP con versión 8+.
services:
  mysql:
    image: mysql:8.4
    container_name: banana-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_change_me
      MYSQL_DATABASE: banana_escolar
      MYSQL_USER: banana_user
      MYSQL_PASSWORD: banana_pass
    ports:
      - '3306:3306'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - banana_mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot_pass_change_me']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  banana_mysql_data:
